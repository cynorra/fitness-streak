name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          cat > .env <<EOT
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ADMOB_APP_ID=${{ secrets.EXPO_PUBLIC_ADMOB_APP_ID }}
          EXPO_PUBLIC_ADMOB_BANNER_ID=${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ID }}
          EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID=${{ secrets.EXPO_PUBLIC_ADMOB_INTERSTITIAL_ID }}
          EOT

      - name: Restore upload keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/vitatribe-release.keystore
          cat > android/keystore.properties <<EOT
          storeFile=vitatribe-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOT

      - name: Build AAB and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/vitatribe-${{ github.ref_name }}.aab
          cp android/app/build/outputs/apk/release/app-release.apk out/vitatribe-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vitatribe-release
          path: out/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
