<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  .canvas { position: relative; width: 1080px; height: 1920px; background: #0a0a0a; }
  .caption { padding: 96px 72px 40px; }
  .headline { color: #fafafa; font-size: 76px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.08; }
  .headline .accent { color: #10b981; }
  .subhead { color: #a1a1aa; font-size: 32px; font-weight: 700; margin-top: 20px; line-height: 1.4; max-width: 880px; }

  .app { margin: 8px 60px 0; }
  .toprow { display: flex; align-items: center; gap: 24px; padding: 24px 8px 40px; }
  .back { color: #fff; font-size: 56px; font-weight: 900; }
  .title { color: #fff; font-size: 44px; font-weight: 900; letter-spacing: 1px; flex: 1; text-align: center; margin-right: 56px; }

  .infobox { background: rgba(16,185,129,0.12); border: 3px solid rgba(16,185,129,0.32); border-radius: 32px; padding: 36px; margin-bottom: 40px; }
  .infobox span { color: #10b981; font-size: 26px; font-weight: 800; line-height: 1.5; }

  .row { background: #111; border-radius: 40px; padding: 32px 36px; margin-bottom: 28px; display: flex; align-items: center; border: 3px solid #222; }
  .row.me { border-color: #10b981; background: rgba(16,185,129,0.08); }
  .rank { width: 60px; color: #71717a; font-size: 40px; font-weight: 900; }
  .row.me .rank { color: #10b981; }
  .ravatar { width: 100px; height: 100px; border-radius: 50px; background: #10b981; display: flex; align-items: center; justify-content: center; margin: 0 28px; }
  .ravatar span { color: #fff; font-size: 44px; font-weight: 900; }
  .rinfo { flex: 1; }
  .rname { color: #fff; font-size: 34px; font-weight: 800; }
  .rhandle { color: #52525b; font-size: 24px; font-weight: 700; margin-top: 6px; }
  .rstreak { display: flex; align-items: center; gap: 12px; background: #1a1a1a; padding: 18px 26px; border-radius: 30px; border: 2px solid #333; }
  .rstreak .em { font-size: 30px; }
  .rstreak .ct { color: #fff; font-size: 34px; font-weight: 900; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="caption">
      <div class="headline">Train With <span class="accent">Friends.</span></div>
      <div class="subhead">Climb the leaderboard and keep each other accountable.</div>
    </div>
    <div class="app">
      <div class="toprow"><span class="back">←</span><span class="title">LEADERBOARD</span></div>
      <div class="infobox"><span>🏆 Top streaks this week — log a workout, climb the ranks!</span></div>

      <div class="row"><div class="rank">1</div><div class="ravatar"><span>J</span></div><div class="rinfo"><div class="rname">Jordan Lee</div><div class="rhandle">@jordanlifts</div></div><div class="rstreak"><span class="em">🔥</span><span class="ct">47</span></div></div>
      <div class="row"><div class="rank">2</div><div class="ravatar"><span>M</span></div><div class="rinfo"><div class="rname">Maya Chen</div><div class="rhandle">@coach.maya</div></div><div class="rstreak"><span class="em">🔥</span><span class="ct">41</span></div></div>
      <div class="row"><div class="rank">3</div><div class="ravatar"><span>S</span></div><div class="rinfo"><div class="rname">Sam Rivera</div><div class="rhandle">@sam.trains</div></div><div class="rstreak"><span class="em">🔥</span><span class="ct">38</span></div></div>
      <div class="row me"><div class="rank">4</div><div class="ravatar"><span>Y</span></div><div class="rinfo"><div class="rname">You</div><div class="rhandle">@you</div></div><div class="rstreak"><span class="em">🔥</span><span class="ct">35</span></div></div>
      <div class="row"><div class="rank">5</div><div class="ravatar"><span>P</span></div><div class="rinfo"><div class="rname">Priya Nair</div><div class="rhandle">@priya.fit</div></div><div class="rstreak"><span class="em">🔥</span><span class="ct">29</span></div></div>
    </div>
  </div>
</body>
</html>
