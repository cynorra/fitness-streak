<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #08090a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 1024px;
    height: 500px;
    background:
      radial-gradient(600px 400px at 850px 60px, rgba(16,185,129,0.16), transparent 60%),
      radial-gradient(500px 380px at 120px 480px, rgba(245,158,11,0.14), transparent 60%),
      linear-gradient(160deg, #0a0a0a 0%, #0c0c0d 55%, #0a0a0a 100%);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(700px 500px at 30% 50%, black, transparent 75%);
  }
  .glow {
    position: absolute;
    width: 460px;
    height: 460px;
    left: -80px;
    top: 20px;
    background: radial-gradient(circle, rgba(245,158,11,0.22) 0%, rgba(245,158,11,0) 68%);
    filter: blur(2px);
  }
  .icon {
    position: absolute;
    left: 54px;
    top: 78px;
    width: 344px;
    height: 344px;
    border-radius: 76px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .content {
    position: absolute;
    left: 452px;
    top: 0;
    right: 48px;
    height: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wordmark {
    font-size: 76px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: #fafafa;
    line-height: 1;
    margin-bottom: 22px;
  }
  .wordmark .accent { color: #10b981; }
  .tagline {
    font-size: 25px;
    font-weight: 700;
    color: #a1a1aa;
    line-height: 1.42;
    max-width: 520px;
    margin-bottom: 30px;
  }
  .pills {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 9px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #e4e4e7;
    text-transform: uppercase;
  }
  .pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 10px 2px rgba(16,185,129,0.6);
  }
  .pill.amber .dot { background: #f59e0b; box-shadow: 0 0 10px 2px rgba(245,158,11,0.6); }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="glow"></div>
    <img class="icon" src="../icon/icon-512.png" />
    <div class="content">
      <div class="wordmark">Vita<span class="accent">Tribe</span></div>
      <div class="tagline">Turn workouts &amp; diet into a streak you won't want to break.</div>
      <div class="pills">
        <div class="pill amber"><span class="dot"></span>Streaks</div>
        <div class="pill"><span class="dot"></span>Friends</div>
        <div class="pill amber"><span class="dot"></span>Real Dietitians</div>
      </div>
    </div>
  </div>
</body>
</html>
